<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 1) Change the title -->
<title>New tracker</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#000000; --surface:#0d0f0e; --sunk:#070807; --fg:#e9ece7; --muted:#8e968f; --line:#1f2421;
  --vue:#5fd39e; --vue-soft:#10261c; --theory:#5fd39e;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:15px/1.55 var(--f-body)}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 64px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:14px}
.back{font-size:.84rem;color:var(--muted);text-decoration:none}.back:hover{color:var(--fg)}
h1{font:800 clamp(1.7rem,4.5vw,2.4rem)/1.1 var(--f-display);margin:0}
h1 span{color:var(--vue)}
.sub{color:var(--muted);margin:.5rem 0 0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:18px -16px 16px;padding:12px 16px}
.meter-label{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meter-label strong{color:var(--fg)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;width:0;background:var(--vue);border-radius:99px;transition:width .3s}
.status{font-size:.77rem;color:var(--muted);margin-top:6px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.section h2{font:600 1rem var(--f-body);margin:0;padding:12px 14px;display:flex;justify-content:space-between;gap:8px}
.section h2 small{font:600 .78rem var(--f-mono);color:var(--muted)}
.items{list-style:none;margin:0;padding:0}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.item input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--vue);cursor:pointer;flex:none}
.item.done span{color:var(--muted);text-decoration:line-through}
.item input:focus-visible{outline:2px solid var(--vue);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><a class="back" href="../">← All artifacts</a><div id="account"></div></div>
  <!-- 2) Change the heading and the line under it -->
  <h1>New <span>tracker</span></h1>
  <p class="sub">One line about what this page tracks.</p>

  <div class="top">
    <div class="meter-label"><span>Done <strong id="num">0 / 0</strong></span><span id="pct">0%</span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="status" id="status">Loading…</div>
  </div>
  <div id="list"></div>
</div>

<script type="module">
import { mountAuth, configured, db, doc, onSnapshot, setDoc, serverTimestamp } from "../assets/auth.js";

// 3) A unique id for this page. It's where progress is stored: users/{uid}/apps/{APP_ID}.
//    Never change it after people start using the page, or their progress won't load.
const APP_ID = "new-tracker";

// 4) Your content. Each section has a title and a list of items.
//    Give every item a short, permanent id; ticks are saved against it.
const SECTIONS = [
  { title: "Week 1", items: [
    { id: "w1-a", text: "First thing to do" },
    { id: "w1-b", text: "Second thing to do" },
  ]},
  { title: "Week 2", items: [
    { id: "w2-a", text: "Another thing" },
  ]},
];

/* ---------- nothing below needs changing ---------- */
const LS = "artifacts-" + APP_ID;
let key = LS, done = {}, saver = null, timer = null, unsub = null, pending = false;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const readLocal = () => { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; } };
const writeLocal = () => { try { localStorage.setItem(key, JSON.stringify(done)); } catch {} };

$("list").innerHTML = SECTIONS.map(s => `
  <section class="section"><h2>${esc(s.title)}<small data-count></small></h2>
  <ul class="items">${s.items.map(it => `
    <li><label class="item" data-id="${esc(it.id)}"><input type="checkbox"><span>${esc(it.text)}</span></label></li>`).join("")}
  </ul></section>`).join("");

function render() {
  let total = 0, ticked = 0;
  document.querySelectorAll(".section").forEach((sec, i) => {
    let t = 0, d = 0;
    SECTIONS[i].items.forEach(it => { t++; if (done[it.id]) d++; });
    sec.querySelector("[data-count]").textContent = d + " / " + t;
    total += t; ticked += d;
  });
  document.querySelectorAll(".item").forEach(el => {
    const on = !!done[el.dataset.id]; el.classList.toggle("done", on); el.querySelector("input").checked = on;
  });
  const p = total ? Math.round(ticked / total * 100) : 0;
  $("num").textContent = ticked + " / " + total; $("pct").textContent = p + "%"; $("bar").style.width = p + "%";
}
const status = t => $("status").textContent = t;

$("list").addEventListener("change", e => {
  const el = e.target.closest(".item"); if (!el) return;
  if (e.target.checked) done[el.dataset.id] = true; else delete done[el.dataset.id];
  render(); writeLocal();
  if (saver) { pending = true; clearTimeout(timer); timer = setTimeout(async () => {
    try { await saver({ done }); status("Saved to your account."); } catch { status("Couldn't save just now. Kept in this browser."); }
    pending = false;
  }, 600); }
});

function useAccount(uid) { clearTimeout(timer); saver = null; pending = false; key = uid ? LS + "-u-" + uid : LS; done = readLocal(); render(); }

useAccount(null);
status(configured ? "Not signed in. Ticks are saved in this browser only." : "Ticks are saved in this browser only.");

mountAuth({
  appName: document.title,
  onSignIn(user) {
    if (unsub) unsub();
    useAccount(user.uid); status("Loading your account…");
    const ref = doc(db, "users", user.uid, "apps", APP_ID);
    saver = data => setDoc(ref, { ...data, updatedAt: serverTimestamp() });
    let first = true;
    unsub = onSnapshot(ref, snap => {
      if (snap.metadata.hasPendingWrites || pending) return;
      if (snap.exists()) { done = { ...(snap.data().done || {}) }; writeLocal(); render(); status("Saved to your account."); }
      else if (first) status("Ready. Ticks save to your account.");
      first = false;
    }, () => status("Account sync stopped. Ticks are kept in this browser."));
  },
  onSignOut() { if (unsub) { unsub(); unsub = null; } useAccount(null); status("Not signed in. Ticks are saved in this browser only."); }
});
</script>
</body>
</html>
