<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifacts</title>
<meta name="theme-color" content="#1b1b1b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="modulepreload" href="./assets/auth-core.js">
<!-- fonts load without blocking the page; system fonts show until they arrive -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" media="print" onload="this.media='all'">
<style>
/* Dark grey (#1b1b1b), monochrome. */
:root{
  --bg:#1b1b1b; --surface:#252525; --sunk:#202020; --fg:#ededed; --muted:#a3a3a3; --line:#333333;
  --accent:#ffffff; --tag-bg:#303030; --theory:#e9ece7;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--fg);font:15px/1.55 var(--f-body);min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 64px}
.head{display:flex;justify-content:flex-end;align-items:center;min-height:36px;margin-bottom:36px}
h1{font:800 clamp(2.2rem,7vw,3.4rem)/1 var(--f-display);margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);margin:.8rem 0 32px;max-width:52ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:border-color .15s,box-shadow .15s,transform .15s}
/* white outline: on hover (mouse) and instantly on press (touch) */
@media (hover:hover){.card:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);transform:translateY(-2px)}}
.card:active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);transition:none}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card .tag{align-self:flex-start;font:600 .7rem var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--tag-bg);border-radius:6px;padding:.2rem .5rem}
.card h2{font:600 1.08rem var(--f-body);margin:6px 0 0;display:flex;align-items:center;gap:10px}
.card h2 img{width:26px;height:26px;object-fit:contain;flex:none}
.card p{margin:0;color:var(--muted);font-size:.9rem}
.card .go{margin-top:auto;padding-top:10px;color:var(--fg);font-size:.85rem;font-weight:600}
.foot{color:var(--muted);font-size:.8rem;margin-top:40px;border-top:1px solid var(--line);padding-top:16px}
@media (prefers-reduced-motion: reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div id="account"></div></div>
  <h1>Artifacts</h1>
  <p class="sub">Small study tools. Sign in once and your progress follows you to any device.</p>

  <div class="grid" id="grid"></div>

  <p class="foot">Progress is private to your account.</p>
</div>
<script>
/* ===== Your artifacts. Add one line per page; the card appears on the home page. =====
   folder: the folder name in the repo (the page inside it is index.html)
   name:   what the card says
   tag:    small label above the name (optional)
   about:  one line under the name (optional)
   icon:   a logo next to the name (optional). Either a file in the folder ("js_course/logo.svg")
           or a brand icon from simpleicons.org: "https://cdn.simpleicons.org/<name>" e.g. python, tensorflow, react                                        */
const ARTIFACTS = [
  { folder: "mad2-tracker", name: "MAD-II study tracker", tag: "IIT Madras · MAD-II", about: "All 57 videos, week by week, with theory and code checklists and notes." },
  { folder: "js_course",    name: "JavaScript Course",    tag: "Apna College · JS",   about: "Every example and practice question from the JS full course, lecture by lecture.", icon: "js_course/logo.svg" },
  { folder: "pytorch",      name: "PyTorch",              tag: "Self-study · PyTorch", about: "Package by package, from tensors to training, evaluating and shipping models.", icon: "https://cdn.simpleicons.org/pytorch" },
];

const esc = s => String(s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("grid").innerHTML = ARTIFACTS.map(a => `
  <a class="card" href="${esc(a.folder)}/">
    ${a.tag ? `<span class="tag">${esc(a.tag)}</span>` : ""}
    <h2>${a.icon ? `<img src="${esc(a.icon)}" alt="" onerror="this.remove()">` : ""}${esc(a.name)}</h2>
    ${a.about ? `<p>${esc(a.about)}</p>` : ""}
    <span class="go">Open →</span>
  </a>`).join("");
</script>
<script type="module">
import { mountAuth } from "./assets/auth-core.js";
mountAuth({ appName: "these tools", required: false });
</script>
</body>
</html>
